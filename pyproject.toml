[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-audited-equity-crew"
version = "0.1.0"
description = "Role-based CrewAI equity research workflow with dated search evidence, explicit UNAVAILABLE financial metric flags, and rubric-scored decision artifacts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Pranil Deshmukh" }
]
dependencies = [
  "pydantic>=2.7.0",
  "crewai>=0.80.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
equity-crew = "equity_crew.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
